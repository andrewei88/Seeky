name: ARYA
options:
  bundleIdPrefix: com.arya
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
targets:
  ARYA:
    type: application
    platform: iOS
    sources:
      - path: ARYA
        excludes:
          - "Resources/Vocabulary"
      - path: ARYA/Resources/Vocabulary
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: ARYA/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.arya.objectlearning
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - ARYATests
  ARYATests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ARYATests
    dependencies:
      - target: ARYA
    settings:
      base:
        INFOPLIST_FILE: ARYATests/Info.plist
