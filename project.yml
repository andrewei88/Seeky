name: Seeky
options:
  bundleIdPrefix: com.seeky
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
targets:
  Seeky:
    type: application
    platform: iOS
    sources:
      - path: Seeky
        excludes:
          - "Resources/Vocabulary"
      - path: Seeky/Resources/Vocabulary
        type: folder
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Seeky/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.seeky.objectlearning
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: U5U8CN6FA9
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - SeekyTests
  SeekyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeekyTests
    dependencies:
      - target: Seeky
    settings:
      base:
        INFOPLIST_FILE: SeekyTests/Info.plist
        DEVELOPMENT_TEAM: U5U8CN6FA9
        CODE_SIGN_STYLE: Automatic
